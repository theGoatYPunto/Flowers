<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Un secreto para Aroa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #gate {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            transition: opacity 1.2s ease;
        }

        #discover {
            padding: 17px 30px;
            color: #ffe3a0;
            background: transparent;
            border: 1px solid #d9aa50;
            border-radius: 40px;
            font-size: 18px;
            letter-spacing: .5px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(218, 170, 80, .12);
        }

        #discover:active {
            transform: scale(.96);
        }

        #message {
            position: fixed;
            z-index: 5;
            top: 5%;
            left: 5%;
            width: 90%;
            color: #ffe5a0;
            font-size: clamp(17px, 4vw, 25px);
            line-height: 1.5;
            text-align: center;
            opacity: 0;
            transition: opacity 2s ease;
            text-shadow: 0 0 12px #d49a35;
            pointer-events: none;
        }

        #message.visible {
            opacity: 1;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <canvas id="screen"></canvas>

    <div id="gate">
        <button id="discover">Descubrir secreto</button>
    </div>

    <div id="message">
        Para que veas que los informáticos sí somos productivos Aroa 
    </div>

    <script src="bouquet.js"></script>

</body>

</html>
